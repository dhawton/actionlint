on: push
cache-mode: read
jobs:
  default:
    runs-on: ubuntu-latest
    steps:
      - run: echo hello
  write:
    runs-on: ubuntu-latest
    cache-mode: write
    steps:
      - run: echo hello
  write-only:
    runs-on: ubuntu-latest
    cache-mode: write-only
    steps:
      - run: echo hello
  none:
    runs-on: ubuntu-latest
    cache-mode: none
    steps:
      - run: echo hello
  call:
    uses: owner/repo/.github/workflows/reusable.yaml@main
    cache-mode: read
